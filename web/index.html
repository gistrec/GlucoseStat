<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Обе темы объявлены, иначе браузер рисует свои элементы — полосы
         прокрутки, поле поиска по странице — в тёмном варианте поверх
         светлой страницы. -->
    <meta name="color-scheme" content="dark light" />
    <!-- Панель Safari на iOS красится в этот цвет. Значение ставит app.js: по
         медиазапросу оно отвечало бы за систему даже тогда, когда тему выбрали
         кнопкой вручную. -->
    <meta name="theme-color" id="theme-color" content="#07070b" />

    <script>
        /* Выбранная тема применяется до первой отрисовки. Остальной скрипт
           грузится в конце body, и без этих трёх строк светлая страница
           моргала бы чёрным на каждом открытии. */
        try {
            const saved = localStorage.getItem("theme");
            document.documentElement.dataset.theme =
                saved === "light" || saved === "dark"
                    ? saved
                    : window.matchMedia("(prefers-color-scheme: dark)").matches
                      ? "dark"
                      : "light";
        } catch (error) {
            /* Приватный режим Safari запрещает localStorage: тема не
               запомнится, но страница обязана открыться. */
        }
    </script>
    <title>Глюкоза — gistrec.cloud</title>
    <meta name="description" content="Показания сенсора FreeStyle Libre 3, обновляются каждые пять минут." />
    <meta name="robots" content="noindex" />

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main class="page">
        <header class="head">
            <div class="head__text">
                <h1 class="head__title">Глюкоза</h1>
                <p class="head__sub">FreeStyle Libre 3 → LibreLinkUp, обновление каждые 5 минут</p>
            </div>
            <!-- Подпись и заголовок задаёт app.js: кнопка перебирает три
                 состояния, и её текст — единственное, что о них сообщает. -->
            <button class="theme" id="theme" type="button"></button>
        </header>

        <section class="now" id="now" hidden>
            <div class="now__reading">
                <span class="now__value" id="now-value">—</span>
                <span class="now__unit">ммоль/л</span>
                <span class="now__arrow" id="now-arrow"></span>
            </div>
            <p class="now__meta" id="now-meta"></p>
        </section>

        <p class="empty" id="empty" hidden></p>

        <nav class="ranges" id="ranges" aria-label="Период" hidden>
            <button class="ranges__btn is-active" data-range="day" type="button" aria-pressed="true">24 часа</button>
            <button class="ranges__btn" data-range="week" type="button" aria-pressed="false">7 дней</button>
            <button class="ranges__btn" data-range="month" type="button" aria-pressed="false">30 дней</button>
        </nav>

        <section class="chart" id="chart" hidden>
            <!-- Содержимое рисуется скриптом, поэтому подпись задаётся там же:
                 для скринридера холст сам по себе — пустое место. -->
            <canvas id="canvas" role="img"></canvas>
            <p class="chart__empty" id="chart-empty" hidden>За этот период данных нет</p>
            <!-- Подсказка следует за курсором; значения из неё продублированы
                 в таблице ниже, чтобы ничего не пряталось за наведением. -->
            <div class="tip" id="tip" hidden></div>
            <ul class="legend" id="legend" hidden></ul>
        </section>

        <section class="stats" id="stats" hidden></section>

        <section class="review" id="review" hidden>
            <h2 class="review__title">Разбор приёмов пищи</h2>
            <p class="review__note" id="review-note"></p>

            <section class="stats" id="review-stats"></section>

            <div class="review__panel">
                <canvas id="overlay" role="img"></canvas>
                <ul class="legend" id="overlay-legend"></ul>
            </div>

            <div class="meals__wrap">
                <table class="meals" id="meals">
                    <caption class="visually-hidden">Приёмы пищи и что было с глюкозой после каждого</caption>
                </table>
            </div>
        </section>

        <footer class="foot">
            <p id="foot-updated"></p>
            <p>Целевой диапазон 3,9–10,0 ммоль/л. Не медицинский прибор — данные носят справочный характер.</p>
        </footer>
    </main>

    <script src="app.js"></script>
</body>
</html>
